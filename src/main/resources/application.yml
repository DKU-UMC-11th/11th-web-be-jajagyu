# 모든 환경이 함께 쓰는 공통 설정. 환경마다 달라지는 값(DB 주소 등)은 application-local.yml / application-prod.yml 로 나눈다.
spring:
  profiles:
    default: local # SPRING_PROFILES_ACTIVE 를 따로 주지 않으면 로컬 설정을 쓴다
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: movie
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10} # 기본 10(Hikari 기본값). 3주차에서 환경 변수로만 바꿔 비교한다
  jpa:
    hibernate:
      ddl-auto: validate # 기본값은 "기존 스키마를 검증만" 한다. 운영 데이터를 자동으로 바꾸지 않는다.
    open-in-view: false
server:
  port: 8080
  shutdown: graceful # 종료 시 처리 중인 요청을 끝내고 내려간다(무중단 배포)
jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키(32자 이상). 코드에 직접 쓰지 않는다
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600} # 토큰 유효시간(초)
frontend:
  # 배포된 프론트 주소(Origin). 쉼표로 여러 개를 적을 수 있다. 스킴과 호스트만, 뒤에 경로를 붙이지 않는다.
  origin: ${FRONTEND_ORIGIN:}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # prometheus 를 직접 열어야 /actuator/prometheus 가 생긴다
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true # 없으면 히스토그램 버킷이 아니라 합계만 나온다
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,800ms,1500ms,3s
